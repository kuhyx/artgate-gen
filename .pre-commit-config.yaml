# The same gate CI runs, so a clean commit means a green build. pytest runs at
# push time rather than commit time to keep commits cheap; everything else is
# fast enough to run on every commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Pinned to match the CI and the local venv exactly. A version drift here
  # once failed a push that linted clean locally.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-contract
        name: repo contract (CLAUDE.md Commands + test_changed)
        entry: scripts/check_repo_contract.sh
        language: system
        pass_filenames: false
        files: ^(CLAUDE\.md|AGENTS\.md|scripts/test_changed\.sh)$
      - id: mypy
        name: mypy --strict
        entry: venv/bin/python -m mypy --strict
        language: system
        types: [python]
        pass_filenames: false
        args: [artgate_gen, tools, tests, generate.py, mcp_server.py]

      - id: line-cap
        name: no file over 250 lines
        entry: venv/bin/python tools/check_line_cap.py
        language: system
        pass_filenames: true

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      - id: pytest
        name: pytest (100% branch coverage)
        entry: venv/bin/python -m pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Four markdown namespaces (README / CLAUDE* / DOCS* / TODO*), plus the
      # rule that a TODO carries "REMOVE ME AFTER FINISH" and nothing else may.
      # Shared gate in ~/src/utils owns the namespaces and the exemption list, so
      # one repo's idea of a valid name cannot drift from every other repo's.
      - id: md-naming
        name: markdown naming convention
        entry: scripts/check_md_naming.sh
        language: system
        files: \.(md|markdown)$
