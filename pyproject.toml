[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artgate-gen"
version = "0.1.0"
description = "SDXL + pixel-art LoRA icon generation with deterministic art gates, as an MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "kuhyx" }]
keywords = ["mcp", "pixel-art", "sdxl", "game-art", "icons"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
# Base install stays small on purpose: `gate_icon` and `describe_icon` need no
# model, so a reviewer (or Glama's build sandbox) can install and introspect the
# server without pulling gigabytes of CUDA wheels. Generation lives in the
# `generate` extra.
dependencies = ["pillow>=11", "numpy>=2", "mcp>=1.12,<2"]

[project.optional-dependencies]
generate = [
  "torch>=2.11",
  "torchvision>=0.26",
  "diffusers>=0.39",
  "transformers>=5.15",
  "accelerate>=1.14",
  "peft>=0.20",
  "safetensors>=0.8",
]
dev = ["pytest>=8", "pytest-cov>=6", "ruff==0.15.2", "mypy>=1.14"]

[project.scripts]
artgate-gen = "artgate_gen.cli:main"
artgate-gen-mcp = "artgate_gen.server:main"
artgate-gate = "artgate_gen.gate.cli:main"

[project.urls]
Homepage = "https://github.com/kuhyx/artgate-gen"
Issues = "https://github.com/kuhyx/artgate-gen/issues"

[tool.hatch.build.targets.wheel]
packages = ["artgate_gen"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
# Every entry here is a rule that cannot be satisfied in source. Nothing is
# listed because it was tedious to fix; there are no per-file-ignores and no
# inline `noqa` anywhere in this repo.
ignore = [
  "D203",   # incompatible with D211; ruff itself warns and picks D211.
  "D213",   # incompatible with D212; ruff itself warns and picks D212.
  "COM812", # trailing commas are the formatter's job; enabling both fights.
  "ISC001", # flags implicit concatenation the formatter itself produces.
  "S603",   # fires on every subprocess call, even a hardcoded absolute path.
]

[tool.ruff.lint.pylint]
# `generate_icons` genuinely takes six: out_dir, subjects, size, candidates,
# seed and keep_raw. They are the MCP tool's published schema, so collapsing
# them into an options object would change the wire contract for callers.
max-args = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["artgate_gen"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

# The ML stack is deliberately absent from the CI check job: installing it is
# 1.3 GB and ~28 s even warm, which alone would break the 60 s budget. Without
# this, mypy would pass locally (where the venv has torch) and fail in CI --
# the exact green-local/red-CI split the pinned ruff version exists to prevent.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "diffusers.*",
  "transformers.*",
  "huggingface_hub.*",
  "peft.*",
]
ignore_missing_imports = true

# torch ships `py.typed` but leaves parts of its own surface untyped (for
# example `torch.backends.cudnn.version`), and diffusers' `from_pretrained` is
# likewise untyped. Under `strict` those calls are errors even with the library
# installed. Relaxed only for the two modules that touch the ML stack, so every
# other module -- the gate, the finisher, the CLI, the server -- keeps the full
# strict treatment including untyped-call detection.
[[tool.mypy.overrides]]
module = [
  "artgate_gen.pipeline",
  "artgate_gen.profiling.run",
  # Exercises the same untyped library surface against the stubs.
  "tests.test_types",
  "tests.test_pipeline",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--cov=artgate_gen",
  "--cov=tools",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=100",
]
filterwarnings = [
  # Warnings are errors: a ResourceWarning here already caught a real
  # file-descriptor leak in the repair path.
  "error",
  # Raised by pydantic_settings from inside FastMCP's own constructor, about
  # FastMCP's own `lifespan` field. Nothing in this repository triggers it and
  # nothing here can fix it; only this one message from that one module is
  # exempt, so a leak of our own still fails the suite.
  "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]

[tool.coverage.run]
source = ["artgate_gen", "tools"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
  "if TYPE_CHECKING:",
  'if __name__ == "__main__":',
  # Protocol method bodies. These are declarations, not code: the `...` is
  # never executed by anything, so requiring coverage of it would mean writing
  # a test that calls a method with no implementation.
  '^\s*\.\.\.$',
]
