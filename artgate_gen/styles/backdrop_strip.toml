# Parallax backdrop strip at 256x64: the first non-square, non-icon target.
#
# WHY THIS EXISTS. Everything else artgate produces is a single centred object
# on a void. A parallax strip is the opposite: full-bleed, no subject, and
# tiled horizontally -- three instances are live on screen at once, so a
# discontinuous wrap shows as a seam on every frame rather than once.
#
# RENDER PATH. Rendered at 2304x512, wrap-blended over the 256px overlap, and
# cropped to 2048x512 before an integer 8x reduction to 256x64. 2048x512 is a
# real SDXL training bucket (exactly 1024^2 area), and 2048/256 = 512/64 = 8
# keeps the reduction uniform on both axes. The finisher is `finish_backdrop`,
# which skips `strip_background` -- measured, that flood destroyed 47% of a
# synthetic full-bleed sky (opaque 1.000 -> 0.531) because it starts from the
# border ring and a sky is within tolerance of the border median.
#
# CALIBRATION. `max_colors` stays at 32, the same cap as both icon specs. The
# standing rule is "do not DERIVE the cap from canvas size", not "every style
# shares 32" -- but a backdrop is a sky gradient, which is exactly the content
# most likely to band, and raising the cap is a decision to make against a real
# render rather than a guess made before the first one. If it bands, this is
# where the evidence gets recorded.
#
# There is no `min_margin` and no `alpha_binary`. Both describe a subject
# surrounded by transparency; a full-bleed strip has neither.
name = "backdrop_strip"
canvas = [256, 64]
max_colors = 32

# All seven gates below are non-vacuous except the first two, which the
# finisher guarantees by construction (CANVAS_SIZE, TOO_MANY_COLORS are
# trivial). The other five are genuinely failable:
#   FULLY_OPAQUE_REQUIRED  near-trivial, but makes the strip_background
#                          bypass verifiable rather than trusted. Runs
#                          first of the new block -- the luma gates below
#                          it are meaningless on an image with no opaque
#                          pixels, the same reason ALPHA_NOT_BINARY
#                          precedes TOO_MANY_COLORS.
#   LETTERBOX_BARS         genuinely failable. Requires BOTH a near-black
#                          edge band and a bright interior, so it does not
#                          fire on legitimate night-sky art.
#   NO_VERTICAL_STRUCTURE  genuinely failable -- catches a flat wash.
#   SEAM_ENERGY            genuinely failable if the horizontal wrap
#                          regresses; checked on the horizontal axis only
#                          (see `seam_axes` below) at threshold 4.0. Absent
#                          on purpose: SCALE_NOT_INVARIANT. detect_scale
#                          returns 1 on a finished strip (it is native
#                          resolution, not an integer upscale), so
#                          declaring it here would pass trivially --
#                          exactly the anti-pattern this file's other
#                          comments warn against.
gates = [
  "CANVAS_SIZE",
  "TOO_MANY_COLORS",
  "FULLY_OPAQUE_REQUIRED",
  "LETTERBOX_BARS",
  "NO_VERTICAL_STRUCTURE",
  "SEAM_ENERGY",
]

# CORRECTION, measured against roadside-assistance's shipped art. SEAM_ENERGY
# checked both axes here until this was measured: 13 of the 15 accepted,
# human-approved backdrops/*.png strips (never previously run through this
# gate) score a VERTICAL wrap_discontinuity ratio above 4.0 -- up to 12.6.
# A backdrop strip never tiles top-to-bottom; only three horizontal copies
# are ever live on screen at once. The vertical check was inherited from
# `check_seam_energy`'s general square-tile heritage (ported from
# `tiletool.py`, which does check both axes correctly for an asset that
# tiles both ways) without re-deriving whether it applied to THIS target's
# actual usage. It didn't: a sky-brighter-than-ground strip legitimately
# differs between row 0 and row -1, and that is not a seam. Scoped to the
# one axis this asset actually wraps on.
seam_axes = ["horizontal"]
